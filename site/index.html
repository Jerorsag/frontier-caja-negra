<!doctype html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black Box Replacement · Under construction</title>
<meta name="description" content="This page is under construction. The system design document lives at /docs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --panel:#f6f8fa; --border:#d0d7de; --fg:#1f2328; --muted:#59636e; --accent:#0969da; --on-accent:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --on-accent:#0d1117;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --on-accent:#0d1117;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--fg);font:16px/1.6 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
html[data-lang="en"] [lang="es"], html[data-lang="es"] [lang="en"]{display:none !important}
main{max-width:520px;text-align:center}
.eyebrow{font:500 13px "JetBrains Mono",ui-monospace,Consolas,monospace;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
h1{font-size:clamp(40px,9vw,64px);line-height:1.1;letter-spacing:-.02em;margin:0 0 12px}
p{color:var(--muted);font-size:18px;margin:0 0 28px}
code{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace;font-size:.88em;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:.1em .35em}
a.go{display:inline-block;background:var(--accent);color:var(--on-accent);font-weight:600;text-decoration:none;border-radius:10px;padding:12px 22px}
a.go:hover{filter:brightness(1.08)}
</style>
</head>
<body>
<main>
  <div class="eyebrow"><span lang="en">Under construction</span><span lang="es">En construcción</span></div>
  <h1 lang="en">Oops!</h1>
  <h1 lang="es">¡Upss!</h1>
  <p lang="en">This page is still being built. The system design document lives at <code>/docs</code>.</p>
  <p lang="es">Esta página todavía está en construcción. El documento de diseño del sistema está en <code>/docs</code>.</p>
  <a class="go" href="/docs"><span lang="en">Go to /docs →</span><span lang="es">Ir a /docs →</span></a>
</main>
<script>
// same language + theme preferences as /docs (storage may be unavailable)
const get = k => { try { return localStorage.getItem(k); } catch { return null; } };
const root = document.documentElement;
const lang = get('lang') || ((navigator.language || '').startsWith('es') ? 'es' : 'en');
root.dataset.lang = lang; root.lang = lang;
const theme = get('theme'); if (theme) root.dataset.theme = theme;
</script>
</body>
</html>
