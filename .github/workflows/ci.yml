name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replacement:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TEAM_TOKEN: ci-token
      REPLACEMENT_TOKEN: ci-token
      REPLACEMENT_URL: http://localhost:3000
      PORT: 3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: service/package-lock.json

      - name: Install
        run: npm --prefix service ci

      - name: Typecheck, build, unit and error-order tests
        run: npm --prefix service test

      - name: Start the replacement
        run: |
          node service/dist/server.js > server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sf -H "Authorization: Bearer $TEAM_TOKEN" http://localhost:3000/health; then
              echo " ready"; exit 0
            fi
            sleep 1
          done
          cat server.log; exit 1

      - name: Replay official examples and every logged sequence
        run: node tools/diff.mjs --examples

      - name: Server log
        if: always()
        run: cat server.log || true